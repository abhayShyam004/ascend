{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
<style>
    .hero {
        height: 100vh;
        background-image: url('{% static "images/background.png" %}');
        background-size: cover;
        background-position: center bottom;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 11vh;
        text-align: center;
    }

    .hero::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at 50% 30%, rgba(0,0,0,0.1) 0%, rgba(11,11,13,0.4) 100%);
        z-index: 1;
        pointer-events: none;
    }

    .hero::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 35vh;
        background: linear-gradient(to top, rgba(11, 11, 13, 1) 0%, rgba(200, 50, 20, 0.4) 50%, rgba(11, 11, 13, 0) 100%);
        z-index: 1;
        pointer-events: none;
    }

    .hero-content {
        position: relative;
        z-index: 2;
        max-width: 850px;
        padding: 0 1.5rem;
    }

    .hero h1 {
        font-size: 4.75rem;
        line-height: 1.05;
        margin-bottom: 1.5rem;
        letter-spacing: -0.03em;
        text-shadow: 0 4px 30px rgba(0,0,0,0.8);
        font-weight: 400;
    }

    .hero p {
        font-size: 1.15rem;
        color: rgba(255, 255, 255, 0.85);
        max-width: 540px;
        margin: 0 auto 2.5rem;
        line-height: 1.55;
        text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    .hero-ctas {
        display: flex;
        gap: 1rem;
        justify-content: center;
        align-items: center;
    }

    .cta-primary {
        background: #F3F4F6;
        color: #0b0b0d;
        padding: 0.9rem 2rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        transition: transform 0.15s, opacity 0.15s;
    }

    .cta-primary:hover {
        opacity: 0.92;
        transform: translateY(-2px);
    }

    .cta-secondary {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        padding: 0.9rem 2rem;
        border-radius: 10px;
        font-weight: 500;
        font-size: 1rem;
        transition: background 0.15s, border-color 0.15s;
    }

    .cta-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 768px) {
        .hero h1 {
            font-size: 3.2rem;
        }
        .hero-ctas {
            flex-direction: column;
            width: 100%;
        }
        .cta-primary, .cta-secondary {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<main class="hero">
    <div class="hero-content">
        <h1>Ascend your daily<br>productivity to the<br>absolute peak</h1>
        <p>Intelligent priority sequencing and dynamic task management engineered for high achievers.</p>
        <div class="hero-ctas">
            <a href="{% url 'todo_list' %}" class="cta-primary">Launch Dashboard</a>
            <a href="{% url 'todo_list' %}" class="cta-secondary">Explore Priorities</a>
        </div>
    </div>
</main>
{% endblock %}
