{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ascend - Peak Productivity & Dynamic Priority Engine{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121010;
            --text-color: #F5F5F7;
            --text-muted: #A1A1AA;
            --accent: #E54B4B;
            --accent-warm: #FF5500;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(22, 20, 20, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            font-weight: 400;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Navbar Styles */
        nav {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            letter-spacing: -0.01em;
        }

        .logo-icon {
            width: 26px;
            height: 26px;
            color: #FF5500;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            background: rgba(25, 25, 30, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.75rem 2.25rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .nav-links a {
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-actions a {
            font-size: 0.875rem;
        }

        .btn-primary {
            background-color: #F3F4F6;
            color: #0b0b0d;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.1s;
        }
        
        .btn-primary:hover {
            opacity: 0.92;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="{% url 'landing' %}" class="logo">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3L2 19H7.5L12 11.5L16.5 19H22L12 3Z" fill="currentColor"/>
            </svg>
            Ascend
        </a>
        <div class="nav-links">
            <a href="#">Platform</a>
            <a href="#">Pricing</a>
            <a href="#">Resources</a>
            <a href="#">Blog</a>
        </div>
        <div class="nav-actions">
            <a href="{% url 'todo_list' %}" class="btn-primary">Launch Dashboard</a>
        </div>
    </nav>

    {% block content %}
    {% endblock %}
</body>
</html>
